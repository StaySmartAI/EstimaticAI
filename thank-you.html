<!DOCTYPE html>

<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | EstimaticAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07111f;
      --bg-soft: #0d1b2f;
      --card: #ffffff;
      --text: #ffffff;
      --muted: #b8c2d6;
      --dark: #07111f;
      --blue: #0099ff;
      --blue-dark: #0077cc;
      --line: rgba(255,255,255,0.14);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .thank-you-card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      color: var(--dark);
      border-radius: 32px;
      padding: 56px;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0,0,0,0.42);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,153,255,0.08);
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: -3px;
    }

    p {
      margin: 24px auto 0;
      max-width: 500px;
      font-size: 19px;
      line-height: 1.7;
      color: #667085;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 36px;
      padding: 16px 28px;
      border-radius: 999px;
      background: var(--blue);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 14px 32px rgba(0,153,255,0.24);
      transition: background 0.2s ease;
    }

    .button:hover {
      background: var(--blue-dark);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 14px;
      color: #98a2b3;
    }

    @media (max-width: 640px) {
      .thank-you-card {
        padding: 40px 28px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>

</head>

<body>
  <main class="thank-you-card">
    <div class="badge">✓ Enquiry Sent</div>

```
<h1>Thank you</h1>

<p>
  Your enquiry has been sent successfully. We’ll review your message and get back to you as soon as possible.
</p>

<a class="button" href="/">
  Back to EstimaticAI
</a>

<div class="footer-note">
  EstimaticAI — Instant quote calculators for local service businesses.
</div>
```

  </main>
</body>
</html>
